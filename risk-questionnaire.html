<html lang="fa" dir="rtl">
<head>

<title>پرسشنامه ریسک همبانک</title>
<style>

@font-face {
  font-family: 'Vazir';
  src: local('Vazir'), local('Vazir FD'), local('Vazirmatn');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

:root{--ink:#102543;--muted:#687b91;--blue:#1677c8;--cyan:#18b6ca;--green:#13a56e;--line:#e6edf5;--bg:#f4f8fc}
*{box-sizing:border-box}
body{margin:0;font-family:"Vazir","Vazirmatn",Tahoma,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f9fbfe,#f0f6fb);color:var(--ink)}
.app{min-height:100vh;display:grid;place-items:center;padding:24px}
.phone{width:min(560px,100%);min-height:820px;background:#fff;border:1px solid #e4edf5;border-radius:36px;box-shadow:0 25px 70px rgba(39,76,111,.13);overflow:hidden}
.top{padding:24px 28px 10px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:26px;font-weight:900;display:flex;align-items:center;gap:10px}
.mark{width:27px;height:34px;position:relative} .mark:before,.mark:after{content:"";position:absolute;width:16px;height:30px;border-radius:10px 4px 10px 4px;transform:rotate(-12deg)} .mark:before{background:#11bec7;right:9px} .mark:after{background:#176fc2;left:4px;top:5px}
.exit{font-size:13px;color:var(--muted);cursor:pointer}
.progressRow{padding:0 28px 14px} .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px} .track{height:7px;background:#e8eff5;border-radius:99px;overflow:hidden} .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:.3s}
.content{padding:16px 28px 26px}
h1{font-size:25px;line-height:1.6;text-align:center;margin:0 0 8px} .sub{text-align:center;color:var(--muted);line-height:1.8;font-size:14px;margin:0 0 16px}
.hero{border-radius:24px;overflow:hidden;border:1px solid #e4ebf3;background:#f7fafc;margin:12px 0 18px;box-shadow:0 10px 30px rgba(33,76,115,.07)} .hero img{display:block;width:100%;height:220px;object-fit:cover}
.opts{display:grid;gap:10px} .opt{border:1px solid #e1eaf2;background:#fff;border-radius:17px;padding:14px 16px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:12px} .opt:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(29,84,126,.07)} .opt.sel{border:2px solid var(--blue);background:#f5fbff} .radio{width:21px;height:21px;border-radius:50%;border:2px solid #9eb3c7;flex:0 0 auto;position:relative} .opt.sel .radio{border-color:var(--blue)} .opt.sel .radio:after{content:"";width:11px;height:11px;background:var(--blue);border-radius:50%;position:absolute;inset:3px}
.txt b{display:block;font-size:15px;margin-bottom:4px} .txt span{font-size:12.5px;color:var(--muted);line-height:1.6}
.nav{display:flex;gap:10px;margin-top:18px} button{border:0;border-radius:15px;padding:14px 18px;font-size:15px;cursor:pointer} .next{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#fff;flex:1} .next:disabled{opacity:.35;cursor:not-allowed} .back{background:#edf3f7;color:var(--ink)} 
.result{text-align:center;padding:18px 4px} .score{width:170px;height:170px;border-radius:50%;margin:18px auto;background:conic-gradient(var(--blue) 0deg,#e8eff5 0);display:grid;place-items:center;position:relative} .score:before{content:"";width:132px;height:132px;border-radius:50%;background:#fff;position:absolute} .scorein{position:relative;z-index:1} .num{font-size:48px;font-weight:900} .den{font-size:13px;color:var(--muted)} .badge{display:inline-block;padding:9px 15px;border-radius:99px;font-weight:800;margin:5px 0 10px} .low{background:#edf5ff;color:#2865a7} .mod{background:#fff3da;color:#9b6800} .high{background:#e9f8f0;color:#16814e} .desc{color:var(--muted);line-height:1.9;font-size:14px}
.break{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:18px} .chip{background:#f6f9fc;border-radius:12px;padding:8px;font-size:11px;color:var(--muted)} .chip b{display:block;color:var(--ink);font-size:15px;margin-top:3px}
@media(max-width:600px){.app{padding:0}.phone{border-radius:0;min-height:100vh;border:0}.top,.progressRow,.content{padding-left:16px;padding-right:16px}.hero img{height:195px}h1{font-size:22px}}
</style>

let i=0, A=Array(15).fill(null);
function total(){return A.filter(x=>x!==null).reduce((a,b)=>a+b,0)}
function render(){
 const q=Q[i], sel=A[i];
 document.getElementById('step').textContent=`مرحله ${i+1} از ۱۵`;
 document.getElementById('scoreLive').textContent=`امتیاز ثبت‌شده: ${total()}`;
 document.getElementById('fill').style.width=`${(i+1)/15*100}%`;
 document.getElementById('content').innerHTML=`
   <h1>${q.title}</h1>
   <p class="sub">${q.subtitle}</p>
   <div class="hero"><img src="${V[i+1]}" alt="تصویر سناریوی سؤال ${i+1}"></div>
   <div class="opts">
    ${q.options.map((o,idx)=>`
      <div class="opt ${sel===o[2]?'sel':''}" onclick="choose(${o[2]})">
       <div class="radio"></div>
       <div class="txt"><b>${o[0]}</b><span>${o[1]}</span></div>
      </div>`).join('')}
   </div>
   <div class="nav">
    <button class="back" onclick="prev()" ${i===0?'disabled':''}>قبل</button>
    <button class="next" onclick="next()" ${sel===null?'disabled':''}>${i===14?'مشاهده نتیجه':'مرحله بعد'}</button>
   </div>`;
}
function choose(s){A[i]=s;render()}
function next(){if(A[i]===null)return;if(i<14){i++;render()}else result()}
function prev(){if(i>0){i--;render()}}
function resetQuiz(){if(confirm('پرسشنامه از ابتدا شروع شود؟')){i=0;A=Array(15).fill(null);render()}}
function result(){
 const t=total(); let label,cls,desc;
 if(t<=35){label='L — ریسک‌پذیری پایین';cls='low';desc='فرد محافظه‌کار؛ حفظ سرمایه اولویت اصلی است و تحمل افت بازار پایین است.'}
 else if(t<=55){label='M — ریسک‌پذیری متوسط';cls='mod';desc='فرد متعادل؛ رشد سرمایه را می‌خواهد ولی نوسان را به‌صورت محدود می‌پذیرد.'}
 else{label='H — ریسک‌پذیری بالا';cls='high';desc='فرد ریسک‌پذیر؛ افت‌های کوتاه‌مدت را برای رشد بلندمدت می‌پذیرد.'}
 document.getElementById('step').textContent='نتیجه نهایی';
 document.getElementById('scoreLive').textContent=`امتیاز نهایی: ${t}`;
 document.getElementById('fill').style.width='100%';
 const deg=t/75*360;
 document.getElementById('content').innerHTML=`
 <div class="result">
  <h1>پروفایل ریسک شما</h1>
  <div class="score" style="background:conic-gradient(var(--blue) ${deg}deg,#e8eff5 0deg)">
   <div class="scorein"><div class="num">${t}</div><div class="den">از ۷۵</div></div>
  </div>
  <div class="badge ${cls}">${label}</div>
  <div class="desc">${desc}</div>
  <div class="break">${A.map((s,j)=>`<div class="chip">سؤال ${j+1}<b>${s}</b></div>`).join('')}</div>
  <div class="nav"><button class="back" onclick="review()">مرور پاسخ‌ها</button><button class="next" onclick="resetQuiz()">شروع مجدد</button></div>
 </div>`;
}
function review(){i=0;render()}
render();
</script>
